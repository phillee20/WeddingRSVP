<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wedding RSVP Admin</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/admin.js" defer></script>
  </head>
  <body>
    <main class="admin-shell">
      <section class="admin-header">
        <div>
          <p class="eyebrow">Private</p>
          <h1>Guest Headcount</h1>
        </div>
        <form id="admin-login" class="admin-login">
          <label for="password">Admin password</label>
          <div class="login-row">
            <input id="password" type="password" autocomplete="current-password" required>
            <button type="submit">View</button>
          </div>
        </form>
      </section>

      <section id="admin-results" class="admin-results" hidden>
        <div class="stats">
          <article>
            <span id="headcount">0</span>
            <p>Attending</p>
          </article>
          <article>
            <span id="declined">0</span>
            <p>Not attending</p>
          </article>
          <article>
            <span id="total">0</span>
            <p>Total responses</p>
          </article>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Response</th>
                <th>Song choice</th>
                <th>Submitted</th>
              </tr>
            </thead>
            <tbody id="responses"></tbody>
          </table>
        </div>
      </section>

      <p id="admin-message" class="message" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
